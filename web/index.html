<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join — River invite pool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #1b2942 0%, #0c1322 60%, #070b14 100%);
    color: #e8eef9; padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px; background: #131c2e; border: 1px solid #243049;
    border-radius: 18px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  .tag { display:inline-block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:#8aa0c6; background:#1c2740; border:1px solid #2c3a59; border-radius:999px; padding:4px 10px; margin-bottom:18px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .room { color:#7fd1ff; font-weight:600; }
  .count { margin: 18px 0 6px; font-size: 15px; color:#b9c6de; }
  .count b { color:#fff; font-size:17px; }
  .join {
    display:block; margin-top:22px; padding:15px 20px; border-radius:12px;
    background: linear-gradient(180deg,#3b82f6,#2563eb); color:#fff; font-weight:700; font-size:17px;
    text-decoration:none; border:none; cursor:pointer; transition: filter .15s ease;
  }
  .join:hover { filter: brightness(1.08); }
  .join[aria-disabled="true"] { cursor: default; }
  .hint { margin-top:16px; font-size:12.5px; color:#7e8db0; }
  .code { margin-top:14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; color:#5f6f93; word-break:break-all; background:#0e1626; border:1px solid #1f2a42;
    border-radius:8px; padding:8px; }
  noscript { color:#ffb4b4; }
</style>
</head>
<body>
  <main class="card">
    <span class="tag" id="tag">…</span>
    <h1>Join <span class="room" id="roomName">…</span></h1>
    <div class="count"><b id="count">…</b> <span id="countUnit">syncing…</span></div>
    <a id="join" class="join" rel="noopener" aria-disabled="true">syncing…</a>
    <div class="hint" id="hint">Reading live room membership to find you an unused invite…</div>
    <div class="code" id="codebox" hidden></div>
    <noscript>This page needs JavaScript to pick an invite.</noscript>
  </main>
  <script src="app.js"></script>
</body>
</html>
